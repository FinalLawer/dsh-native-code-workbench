<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH 完整工作台嵌入验证</title>
<style>
body { margin: 0; font: 14px system-ui; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
header { padding: 12px 18px; border-bottom: 1px solid #ddd; }
iframe { flex: 1; width: 100%; border: 0; }
</style>
<header>DSH Code Workbench · Code - OSS / code-server 嵌入验证（独立测试页面）</header>
<iframe title="完整工作台" allow="clipboard-read; clipboard-write"></iframe>
<script>
const workspace = new URL(location.href).searchParams.get('folder');
const server = new URL('http://127.0.0.1:18789/');
if (workspace) server.searchParams.set('folder', workspace);
document.querySelector('iframe').src = server.href;
</script>
</html>
