# dsh-cursor-code — the bundle layer.
#
# One row mounts this package as a Loader entry. That single row is enough for
# both halves: the Node half registers the `POST /api/cursor-code/write` route
# (version-guarded `ctx.fs.writeText`, authenticated by the Connection service),
# and the browser half (`exports["./client"]`, found through this package's
# `dsh.client` declaration) registers the right-sidebar tab type.
#
# The Host Config schema also backs the plugin's user settings form.

- insert:
    - id: cursor-code
      name: 'dsh-code-workbench'
